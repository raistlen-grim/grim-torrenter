# Isolates test-created torrent directories from the real dev-server download
# directory (downloads/, the default) - see design_docs/0026's addendum on why
# this matters now that TorrentEngine.restore() actively scans that directory
# on every startup. target/ is already gitignored and cleared by `mvn clean`.
grimtorrenter.download-directory=target/test-downloads

# dht-enabled/accept-incoming-connections moved into SettingsStore (see design_docs/0041)
# and are no longer plain config properties - TestSettingsResource seeds a settings.json
# here with both false before the app boots, for the same hermetic-test-suite reasons
# this file used to set them directly.
grimtorrenter.config-directory=target/test-config
