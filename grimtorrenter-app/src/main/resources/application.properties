# Placeholder - populated as REST/WebSocket resources are added.
quarkus.application.name=grimtorrenter
#quarkus.log.category."com.grimtorrenter.engine.torrent.TorrentSession".level=DEBUG
grimtorrenter.listen-port=7881
# The frontend offers ["bearer", <token>] as WebSocket subprotocols (design_docs/0061). A browser
# drops the connection the moment the handshake completes unless the server picks one of the
# offered names, so "bearer" has to be accepted here.
quarkus.websockets-next.server.supported-subprotocols=bearer
