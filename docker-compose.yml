# Runs the published image (see design_docs/0003 - still one container, compose is just
# running it - and design_docs/0087 for where the image comes from). This file is all a
# deployment needs; it does not need the source tree. To build the image from source instead,
# add docker-compose.build.yml - see that file.
#
# Nothing in this file is specific to one machine: every path, port and id comes from a
# variable with a working default. To change any of them, copy .env.example to .env (which
# compose reads automatically and git ignores) and edit it there. See design_docs/0085.
services:
  grimtorrenter:
    image: "ghcr.io/raistlen-grim/grim-torrenter:${GRIMTORRENTER_TAG:-latest}"
    container_name: grimtorrenter
    restart: unless-stopped
    environment:
      # The user/group the app runs as - files it creates on the volumes below get this owner.
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      # Must be the same number as the host side of the two port mappings below: it is what the
      # app tells trackers and peers to connect back on.
      GRIMTORRENTER_LISTEN_PORT: "${GRIMTORRENTER_LISTEN_PORT:-6881}"
    ports:
      # Web UI / REST API.
      - "${GRIMTORRENTER_HTTP_PORT:-8080}:8080"
      # BitTorrent: incoming peer connections (tcp) and DHT/uTP (udp).
      - "${GRIMTORRENTER_LISTEN_PORT:-6881}:${GRIMTORRENTER_LISTEN_PORT:-6881}/tcp"
      - "${GRIMTORRENTER_LISTEN_PORT:-6881}:${GRIMTORRENTER_LISTEN_PORT:-6881}/udp"
    volumes:
      - "${GRIMTORRENTER_DOWNLOADS:-./data/downloads}:/app/downloads"
      - "${GRIMTORRENTER_CONFIG:-./data/config}:/app/config"
      - "${GRIMTORRENTER_WATCH:-./data/watch}:/app/watch"
