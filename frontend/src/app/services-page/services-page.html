<h1 class="display-font">Services</h1>

<div class="page-frame blueprint">
  <i class="corner tl" aria-hidden="true"></i><i class="corner tr" aria-hidden="true"></i><i class="corner bl" aria-hidden="true"></i><i class="corner br" aria-hidden="true"></i>

  <ul class="service-list">
    @for (service of services(); track service.name) {
      <li class="service-card">
        <app-status-indicator
          [icon]="statusDisplay(service).icon"
          [label]="statusDisplay(service).label"
          [tone]="statusDisplay(service).tone"
        />
        @if (service.state === 'RUNNING') {
          <i class="pi pi-check-circle service-status-ok" aria-hidden="true"></i>
        } @else if (service.state === 'DEGRADED') {
          <span class="service-status-degraded">Sparse routing table</span>
        }
      </li>
    }
  </ul>
</div>
