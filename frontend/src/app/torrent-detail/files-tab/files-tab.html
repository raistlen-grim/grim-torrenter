@if (files().length === 0) {
  <p class="empty-message">No files yet.</p>
} @else {
  <div class="file-list">
    @for (file of files(); track filePath(file)) {
      <div class="file-row">
        <i class="pi file-icon" [class]="fileTypeIcon(file.pathSegments)" aria-hidden="true"></i>
        <span class="file-path" [title]="filePath(file)">{{ filePath(file) }}</span>
        <span class="file-size tabular-nums">{{ file.length | formatBytes }}</span>
        <span class="file-percent tabular-nums">{{ filePercent(file) }}%</span>
      </div>
    }
  </div>
}
