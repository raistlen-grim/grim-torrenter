<p-toast />

<h1 class="heading-font">Settings</h1>

@if (form(); as settingsForm) {
  <div class="settings-groups">
    <app-appearance-settings [form]="settingsForm.controls.appearance" />
    <app-network-settings [form]="settingsForm.controls.network" />
    <app-rate-limit-settings [form]="settingsForm.controls.rateLimiting" />
    <app-seeding-settings [form]="settingsForm.controls.seeding" />
    <app-event-log-settings [form]="settingsForm.controls.eventLog" />
    <app-watch-folder-settings [form]="settingsForm.controls.watchFolder" />
  </div>

  <div class="save-bar">
    <p-button
      label="Save"
      [disabled]="settingsForm.pristine || settingsForm.invalid || saving()"
      [loading]="saving()"
      (onClick)="save()"
    />
    @if (settingsForm.dirty && !saving()) {
      <span class="unsaved-hint">Unsaved changes</span>
    }
  </div>
} @else {
  <p class="loading-hint">Loading settings…</p>
}
