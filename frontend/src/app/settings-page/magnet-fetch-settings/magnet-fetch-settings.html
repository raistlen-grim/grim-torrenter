<div [formGroup]="form()">
  <div class="settings-row">
    <div class="settings-row-label">
      <label for="magnetFetchTimeBudgetSeconds">Time budget</label>
      <p class="settings-row-description">
        How long to search for metadata before giving up. Takes effect on the next magnet add,
        not retroactively.
      </p>
    </div>
    <div class="settings-row-control">
      <p-inputgroup class="settings-number-group">
        <p-inputnumber
          inputId="magnetFetchTimeBudgetSeconds"
          formControlName="timeBudgetSeconds"
          [min]="1"
          [showButtons]="false"
          inputStyleClass="settings-number-input"
        />
        <p-inputgroup-addon class="settings-number-unit">seconds</p-inputgroup-addon>
      </p-inputgroup>
    </div>
  </div>

  <div class="settings-row">
    <div class="settings-row-label">
      <label for="magnetFetchCandidatesPerRound">Candidates</label>
      <p class="settings-row-description">How many peers to ask for metadata.</p>
    </div>
    <div class="settings-row-control">
      <p-inputgroup class="settings-number-group">
        <p-inputnumber
          inputId="magnetFetchCandidatesPerRound"
          formControlName="candidatesPerRound"
          [min]="1"
          [showButtons]="false"
          inputStyleClass="settings-number-input"
        />
        <p-inputgroup-addon class="settings-number-unit">peers</p-inputgroup-addon>
      </p-inputgroup>
    </div>
  </div>

  <div class="settings-row">
    <div class="settings-row-label">
      <label for="magnetFetchConcurrencyLimit">Concurrency</label>
      <p class="settings-row-description">How many peers to ask at once.</p>
    </div>
    <div class="settings-row-control">
      <p-inputgroup class="settings-number-group">
        <p-inputnumber
          inputId="magnetFetchConcurrencyLimit"
          formControlName="concurrencyLimit"
          [min]="1"
          [showButtons]="false"
          inputStyleClass="settings-number-input"
        />
        <p-inputgroup-addon class="settings-number-unit">connections</p-inputgroup-addon>
      </p-inputgroup>
    </div>
  </div>
</div>
