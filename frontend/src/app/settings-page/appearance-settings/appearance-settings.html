<fieldset [formGroup]="form()">
  <legend class="heading-font">Appearance</legend>

  <div class="setting-row">
    <div class="setting-label">
      <label for="theme">Theme</label>
      <p class="setting-description">
        Light or dark, or follow this browser's own OS-level preference. Applies immediately as a preview - still
        needs Save, below, to persist.
      </p>
    </div>
    <p-select
      inputId="theme"
      formControlName="theme"
      [options]="themeOptions"
      optionLabel="label"
      optionValue="value"
      styleClass="theme-select"
    />
  </div>
</fieldset>
