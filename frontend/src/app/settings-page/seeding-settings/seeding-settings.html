<div [formGroup]="form()">
  <div class="settings-row">
    <div class="settings-row-label">
      <label for="ratioLimit">Ratio limit</label>
      <p class="settings-row-description">Stop seeding once this upload/download ratio is reached.</p>
    </div>
    <div class="settings-row-control">
      <p-inputgroup class="settings-number-group">
        <p-inputnumber
          inputId="ratioLimit"
          formControlName="ratioLimit"
          aria-label="Ratio limit value"
          [min]="0"
          [minFractionDigits]="1"
          [maxFractionDigits]="2"
          [showButtons]="false"
          inputStyleClass="settings-number-input"
        />
        <p-inputgroup-addon class="settings-number-unit">x</p-inputgroup-addon>
      </p-inputgroup>
      <p-toggleswitch inputId="ratioLimitEnabled" formControlName="ratioLimitEnabled" />
    </div>
  </div>

  <div class="settings-row">
    <div class="settings-row-label">
      <label for="timeLimitHours">Time limit</label>
      <p class="settings-row-description">Stop seeding after this long, regardless of ratio.</p>
    </div>
    <div class="settings-row-control">
      <p-inputgroup class="settings-number-group">
        <p-inputnumber
          inputId="timeLimitHours"
          formControlName="timeLimitHours"
          aria-label="Time limit value"
          [min]="0"
          [minFractionDigits]="0"
          [maxFractionDigits]="1"
          [showButtons]="false"
          inputStyleClass="settings-number-input"
        />
        <p-inputgroup-addon class="settings-number-unit">hours</p-inputgroup-addon>
      </p-inputgroup>
      <p-toggleswitch inputId="timeLimitEnabled" formControlName="timeLimitEnabled" />
    </div>
  </div>
</div>
