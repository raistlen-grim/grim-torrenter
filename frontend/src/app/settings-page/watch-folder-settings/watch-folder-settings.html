<div [formGroup]="form()">
  <div class="settings-row">
    <div class="settings-row-label">
      <label for="watchFolderEnabled">Enabled</label>
      <p class="settings-row-description">
        Watch a folder and add any .torrent file dropped into it. Applies to new files
        immediately - no restart needed.
      </p>
    </div>
    <div class="settings-row-control">
      <p-toggleswitch inputId="watchFolderEnabled" formControlName="enabled" />
    </div>
  </div>

  <div class="settings-row">
    <div class="settings-row-label">
      <label for="watchFolderRetentionDays">Retention</label>
      <p class="settings-row-description">
        How long to keep the original .torrent file after adding it. Takes effect on the next
        scan, not instantly.
      </p>
    </div>
    <div class="settings-row-control">
      <p-inputgroup class="settings-number-group">
        <p-inputnumber
          inputId="watchFolderRetentionDays"
          formControlName="retentionDays"
          [min]="1"
          [showButtons]="false"
          inputStyleClass="settings-number-input"
        />
        <p-inputgroup-addon class="settings-number-unit">days</p-inputgroup-addon>
      </p-inputgroup>
    </div>
  </div>
</div>
