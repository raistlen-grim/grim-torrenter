<div [formGroup]="form()">
  <div class="settings-row">
    <div class="settings-row-label">
      <label for="retentionDays">Keep events for</label>
      <p class="settings-row-description">
        How long to keep entries before discarding them. Takes effect on the backend's next
        hourly cleanup, not instantly.
      </p>
    </div>
    <div class="settings-row-control">
      <p-inputgroup class="settings-number-group">
        <p-inputnumber
          inputId="retentionDays"
          formControlName="retentionDays"
          [min]="1"
          [showButtons]="false"
          inputStyleClass="settings-number-input"
        />
        <p-inputgroup-addon class="settings-number-unit">days</p-inputgroup-addon>
      </p-inputgroup>
    </div>
  </div>
</div>
