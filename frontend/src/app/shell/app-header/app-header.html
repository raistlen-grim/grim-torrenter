<header class="shell-header">
  <a routerLink="/" class="wordmark">
    <app-skull-mark class="mark" />
    <span class="display-font">GrimTorrenter</span>
  </a>

  <div class="header-stats tabular-nums">
    <span class="rate">
      <i class="pi pi-arrow-down" aria-hidden="true"></i>{{ totalDownloadRate() | formatRate }}
      @if (events.transfer(); as t) {
        @if (t.downloadCapped) {
          <app-cap-marker [limitBytesPerSec]="t.downloadLimitBytesPerSec" [source]="t.downloadLimitSource" />
        }
      }
    </span>
    <span class="rate">
      <i class="pi pi-arrow-up" aria-hidden="true"></i>{{ totalUploadRate() | formatRate }}
      @if (events.transfer(); as t) {
        @if (t.uploadCapped) {
          <app-cap-marker [limitBytesPerSec]="t.uploadLimitBytesPerSec" [source]="t.uploadLimitSource" />
        }
      }
    </span>
    <app-status-indicator
      [icon]="dhtStatus().enabled ? 'pi-share-alt' : 'pi-circle-off'"
      [label]="dhtStatus().enabled ? dhtStatus().nodeCount + ' DHT nodes' : 'DHT off'"
      [tone]="dhtStatus().enabled ? 'active' : 'dim'"
    />
  </div>

  <a routerLink="/settings" class="settings-link" aria-label="Settings" title="Settings">
    <i class="pi pi-cog" aria-hidden="true"></i>
  </a>
  @if (canLogOut()) {
    <button type="button" class="settings-link logout-button" aria-label="Log out" title="Log out" (click)="logOut()">
      <i class="pi pi-sign-out" aria-hidden="true"></i>
    </button>
  }
</header>
