<nav class="shell-sidebar" aria-label="Filter torrents">
  @for (option of options; track option.value) {
    <a
      routerLink="/"
      class="nav-item"
      [class.active]="filter.statusFilter() === option.value"
      (click)="select(option.value)"
    >
      <i [class]="'pi ' + option.icon" aria-hidden="true"></i>
      <span class="nav-label">{{ option.label }}</span>
      <span class="nav-count tabular-nums">{{ counts()[option.value] }}</span>
    </a>
  }
  <a routerLink="/services" routerLinkActive="active" class="nav-item below-filters">
    <i class="pi pi-shield" aria-hidden="true"></i>
    <span class="nav-label">Services</span>
    @if (failedServiceCount() > 0) {
      <span class="nav-count nav-count-alarm tabular-nums">{{ failedServiceCount() }}</span>
    } @else if (services().length > 0) {
      <i class="pi pi-check-circle nav-status-ok" aria-hidden="true"></i>
    }
  </a>
  <a routerLink="/events" routerLinkActive="active" class="nav-item">
    <i class="pi pi-history" aria-hidden="true"></i>
    <span class="nav-label">Events</span>
  </a>
  <a routerLink="/settings" routerLinkActive="active" class="nav-item">
    <i class="pi pi-cog" aria-hidden="true"></i>
    <span class="nav-label">Settings</span>
  </a>
</nav>
